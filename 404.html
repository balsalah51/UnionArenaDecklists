<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found | Union Arena Deck Base</title>
  <meta name="description" content="That Union Arena Deck Base page is missing." />
  <link rel="stylesheet" href="/css/site.css?v=ua3" />
</head>
<body class="color-red">
  <div class="wrap">
    <header>
      <a class="brand" href="/">
        <div class="logo">UA</div>
        <div>
          <h1>Union Arena Deck Base</h1>
          <div class="subtitle">Union Arena TCG decklists</div>
        </div>
      </a>
      <nav aria-label="Primary">
        <a href="/#recent">Recent lists</a>
        <a href="/#characters">Characters</a>
        <a href="/format.html">Format</a>
        <a href="https://discord.gg/aY9RfB662" target="_blank" rel="noopener">Discord</a>
      </nav>
    </header>

    <main class="single">
      <div class="card hero">
        <div class="crumb"><a href="/">Home</a> / Missing page</div>
        <h2>That page is not here</h2>
        <p>Try the <a href="/">home splash</a>, <a href="/characters.html">character pages</a>, or <a href="/#recent">recent lists</a>.</p>
      </div>
    </main>
    <footer>
      © <span id="year"></span> Union Arena Deck Base. Fan site, not affiliated with Bandai.
      <a href="/characters.html">Characters</a> · <a href="/#recent">Recent lists</a> · <a href="/format.html">Format</a> · <a href="/privacy.html">Privacy</a>
    </footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function(){
      var lines = document.querySelectorAll('.text-line');
      if (!lines.length) return;
      function resetPop(pop){
        pop.style.position = '';
        pop.style.left = '';
        pop.style.top = '';
        pop.style.right = '';
        pop.style.bottom = '';
        pop.classList.remove('flip-left', 'flip-down');
      }
      function place(line){
        var pop = line.querySelector('.card-pop');
        var title = line.querySelector('.card-title');
        if (!pop || !title) return;
        resetPop(pop);
        var tr = title.getBoundingClientRect();
        var width = pop.offsetWidth || 110;
        var height = pop.offsetHeight || 154;
        var left = tr.left;
        var top = tr.top - height - 10;
        if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
        if (left < 12) left = 12;
        if (top < 12) top = tr.bottom + 10;
        if (top + height > window.innerHeight - 12) top = Math.max(12, window.innerHeight - height - 12);
        pop.style.position = 'fixed';
        pop.style.left = left + 'px';
        pop.style.top = top + 'px';
        pop.style.bottom = 'auto';
        pop.style.right = 'auto';
      }
      lines.forEach(function(line){
        line.addEventListener('mouseenter', function(){ place(line); });
        line.addEventListener('focus', function(){ place(line); });
        line.addEventListener('click', function(e){
          if (window.matchMedia('(hover: hover)').matches) return;
          e.stopPropagation();
          lines.forEach(function(other){ if (other !== line) other.classList.remove('is-open'); });
          line.classList.toggle('is-open');
          place(line);
        });
      });
      document.addEventListener('click', function(e){
        if (!e.target.closest('.text-line')) {
          lines.forEach(function(line){ line.classList.remove('is-open'); });
        }
      });
    })();

  </script>
  <script src="/js/site.js?v=ua1"></script>
</body>
</html>
