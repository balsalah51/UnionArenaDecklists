name: Refresh Union Arena data
on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC daily. That is 8:00 AM America/New_York during EDT and 7:00 AM during EST.
    - cron: "0 12 * * *"
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg
          pip install yt-dlp pillow
      - name: Scrape and generate
        run: python3 scripts/ingest.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh Union Arena meta"
          git push
      - name: Warn if a source failed or a new card is unresolved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_alert.py
